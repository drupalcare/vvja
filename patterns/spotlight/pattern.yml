label: 'Spotlight'
description: 'Photo panels side by side; the open one widens, with a bottom bar of segments and previous and next.'
weight: 0
options:
  single_toggle: true
  global_toggle: false
  exclusive_panel: true
  expand_default: 'first'
  transition_speed: 0.7
  animation: 'none'
  accordion_item_width: 0
  pane_padding: 0
  panel_gap: 8
  svg_expand_content: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 14 14" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'
  svg_collapse_content: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 14 14" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
  svg_expand_all: ''
  svg_collapse_all: ''
  enable_css: false
  enable_deeplink: false
  deeplink_identifier: ''
features: []
needs:
  - 'Row style Fields. Every field excluded except two Custom text fields: the first is the header, the second the panel.'
  - 'Header: span.vvj-num (the number) + span.vvj-title (title). Panel: div.vvj-media (image, style vvj_wide_1600) + div.vvj-copy > p.vvj-kicker, p.vvj-summary, p.vvj-link (link).'
  - '3 to 6 items, no pager.'
